name: Release

# BRATはリポジトリルートのmanifest.jsonのバージョンを読み、
# releases/download/<version>/main.js を取得する。
# そのバージョンのリリースに main.js / manifest.json / styles.css を
# 添付しないとBRAT経由で更新が届かないため、ここで自動化する。
#
# 起動方法:
#   - タグをpush        → そのタグ名でリリースを作成（manifest.jsonと一致必須）
#   - 手動実行(dispatch) → ルートmanifest.jsonのバージョンでタグとリリースを作成
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve version
        id: version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PLUGIN_VERSION=$(node -p "require('./plugin/manifest.json').version")

          if [ "$MANIFEST_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::ルートmanifest.json($MANIFEST_VERSION)とplugin/manifest.json($PLUGIN_VERSION)のバージョンが一致しません。"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
              echo "::error::タグ($VERSION)とmanifest.json($MANIFEST_VERSION)のバージョンが一致しません。BRATが資産を取得できなくなります。"
              exit 1
            fi
          else
            VERSION="$MANIFEST_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "リリースバージョン: $VERSION"

      - name: Build plugin
        working-directory: plugin
        run: |
          npm install
          npm run build

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp plugin/main.js dist/main.js
          cp plugin/styles.css dist/styles.css
          cp manifest.json dist/manifest.json
          ls -l dist

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
